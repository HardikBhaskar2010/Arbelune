name: 🐛 Bug Report
description: Report a reproducible problem or unexpected behavior in KAGE
title: "[BUG]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please verify whether your issue relates to an architectural invariant before submitting.
  - type: input
    id: version
    attributes:
      label: KAGE Version / Commit SHA
      description: What version or git commit SHA of KAGE are you running?
      placeholder: "e.g. v0.4.1 (commit 00f5dfa)"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows 11 (x86_64)
        - Windows 10 (x86_64)
        - macOS (Apple Silicon / ARM64)
        - macOS (Intel / x86_64)
        - Linux (Ubuntu / Debian x86_64)
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Launch KAGE via `npm run tauri dev`
        2. Navigate to '...'
        3. Click on '...'
        4. Observe error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs / Terminal Output
      description: Paste any error messages, Rust panics, or browser console outputs.
      render: shell
