name: 💡 Feature Request / RFC
description: Suggest an idea, enhancement, or tool capability for KAGE
title: "[FEATURE]: "
labels: ["enhancement", "proposal"]
body:
  - type: markdown
    attributes:
      value: |
        We welcome proposals for new developer tools, engine features, and autonomous agent capabilities!
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a specific developer pain point?
      placeholder: "I'm always frustrated when..."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see implemented.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you have considered?
  - type: checkboxes
    id: contracts
    attributes:
      label: Architectural Alignment
      description: Confirm alignment with KAGE invariants
      options:
        - label: This feature upholds INV-01 (AI never directly accesses CEF) and INV-02 (All actions pass through ToolBus)
          required: true
